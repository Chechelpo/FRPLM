# =============================================================================
# Database
# =============================================================================

spring.datasource.url=jdbc:h2:file:./data/demo-db;CACHE_SIZE=262144
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=1000

spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.mode=always


# =============================================================================
# Local HTTP server
# =============================================================================

# Restrict the backend to this machine.
server.address=127.0.0.1
server.port=8080


# =============================================================================
# CSRF session
# =============================================================================

# Session containing Spring Security's expected CSRF token.
server.servlet.session.cookie.name=FRPLM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Prevent the CSRF session from expiring too aggressively during long sessions.
server.servlet.session.timeout=24h


# =============================================================================
# Multipart uploads
# =============================================================================

spring.servlet.multipart.max-file-size=10MB


# =============================================================================
# Tokenizer cache
# =============================================================================

tokenizer.cache.retention-days=60
tokenizer.cache.cleanup-cron=0 30 3 * * *


# =============================================================================
# Logging
# =============================================================================

spring.main.log-startup-info=false